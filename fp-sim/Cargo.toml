[package]
name = "fp-sim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[dependencies]
eframe = "0.35.0"
env_logger = "0.11"
log = "0.4.29"
midir = "0.10"
notify = "8.2"
parking_lot = "0.12"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"

fp-sim-protocol = { path = "../fp-sim-protocol" }
libfp = { path = "../libfp" }

[lints.clippy]
large_futures = "warn"

[lints.rust]
unused_must_use = "deny"
