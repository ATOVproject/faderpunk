[package]
name = "faderpunk"
version = "1.12.0"
edition = "2021"
license = "GPL-3.0"

[dependencies]
embedded-io-async = "0.6.1"
embassy-embedded-hal = { version = "0.3.2", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.7.0", features = [
  # Embassy allocates a task pool wholesale on the first spawn of that app type
  # and never frees it, so the reservation is the sum over every app type touched
  # in a boot. An FPApp instance's future carries a fixed 8 KiB instance arena
  # plus its runtime context (~11 KiB), and the pool covers one instance per
  # channel, so installable apps alone reserve ~181 KiB. At 256 KiB that starved
  # the built-in pools and a known-good layout panicked with "task arena is
  # full". The room comes from CORE1_STACK, which measured 2,532 B of its former
  # 128 KiB (see main.rs); spending most of that here keeps built-ins close to
  # the headroom they had before installable apps existed.
  "task-arena-size-393216",
  "arch-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
] }
embassy-time = { version = "0.4.0", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }
embassy-usb = { version = "0.5.0", features = [
  "defmt",
  "max-interface-count-5",
] }
embassy-rp = { version = "0.6.0", features = [
  "defmt",
  "unstable-pac",
  "time-driver",
  "critical-section-impl",
  "rp235xb",
  "binary-info",
] }
embassy-futures = { version = "0.1.0" }

cobs = { version = "0.4.0", default-features = false }
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
enum-ordinalize = "4.3.2"
fm24v10 = "0.1.1"
# NOTE: Older version needed by postcard
heapless = "0.7.17"
libm = "0.2.16"
linreg = { git = "https://github.com/ATOVproject/linreg-rs" }
log = "0.4.29"
max11300 = "0.5.3"
midly = { version = "0.5.3", default-features = false }
mii = "0.2.0"
minicbor = { version = "2.2.1", default-features = false, features = ["derive"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
pio = "0.3.0"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }
postcard = "1.1.3"
serde = { version = "1.0.219", features = ["derive"], default-features = false }
smart-leds = "0.4.0"
static_cell = "2.1.1"
ws2812-async = "0.3.0"

libfp = { path = "../libfp" }
fpapp-sdk = { path = "../fpapp-sdk" }

[build-dependencies]
libfp = { path = "../libfp" }

[features]
# Paints CORE1_STACK with a canary before spawning core1 and periodically
# logs the high-water mark over defmt. Diagnostic only, never enabled in
# release builds.
stack-diag = []


[lints.clippy]
large_futures = "warn"

[lints.rust]
unused_must_use = "deny"
