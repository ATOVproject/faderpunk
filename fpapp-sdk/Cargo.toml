[package]
name = "fpapp-sdk"
description = "Native Rust compatibility shim for installable Faderpunk apps"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
embassy-futures = "0.1"
embassy-sync = "0.7"
heapless = { version = "0.7.17", features = ["serde"] }
libfp = { path = "../libfp" }
midly = { version = "0.5", default-features = false }
postcard = "1"
serde = { version = "1", default-features = false }

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-time-driver = { version = "0.2", optional = true }

[features]
# Provide the `embassy-time` driver for installable apps, backed by the host's
# wake scheduling. Only the packager's generated app crate enables this; the
# firmware links its own driver via embassy-rp.
host-time-driver = ["dep:embassy-time-driver"]
native-example = []

[[example]]
name = "native_probe"
required-features = ["native-example"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
