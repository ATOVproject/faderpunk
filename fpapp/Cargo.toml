[package]
name = "fpapp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Build, inspect, and verify Faderpunk .fpapp packages"

[dependencies]
libfp = { path = "../libfp" }

[target.'cfg(not(target_os = "none"))'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "fpapp"
path = "src/main.rs"
