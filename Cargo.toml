[workspace]
members = ["faderpunk", "fp-core", "fp-sim", "fp-sim-core", "fp-sim-protocol", "libfp"]
# Simulator crates are host-only and enable std features on shared
# dependencies. Keeping them out of the default members prevents those
# features from leaking into the thumb build. Build the desktop pieces
# explicitly with `cargo build -p fp-sim -p fp-sim-core`.
default-members = ["faderpunk", "fp-core", "libfp"]

exclude = ["gen-bindings", "fp-sim-app-example"]
resolver = "2"

[profile.release]
lto = true
incremental = false
codegen-units = 1
debug = 2

[profile.dev]
lto = true
opt-level = "z"
