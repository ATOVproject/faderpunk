cargo-features = ["panic-immediate-abort"]

[workspace]
members = ["faderpunk", "libfp"]

exclude = ["gen-bindings"]

resolver = "2"

[profile.release]
lto = true
incremental = false
codegen-units = 1
debug = 2
panic = "immediate-abort"

[profile.dev]
lto = true
opt-level = "z"
panic = "immediate-abort"
